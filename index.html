<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraFinance - Catatan Keuangan Cantik</title>
    <style>
        /* TEMA VISUAL BUNGA (CSS) */
        :root {
            --primary-pink: #ffb7c5;
            --soft-green: #b7e4c7;
            --dark-text: #4a4e69;
            --petal-white: #ffffff;
            --background: #fdf0f0;
            --accent-gold: #d4a373;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            background-image: url('https://www.transparenttextures.com/patterns/floral-paper.png');
            color: var(--dark-text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .balance-card {
            background: var(--petal-white);
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 183, 197, 0.3);
            border: 2px solid var(--primary-pink);
            margin-bottom: 25px;
        }

        .balance-card h2 { margin: 0; font-size: 1rem; opacity: 0.7; }
        .balance-card #total-balance { font-size: 2.2rem; margin: 10px 0; color: #a44a5f; }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .stat-box {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .income-text { color: #2d6a4f; font-weight: bold; }
        .expense-text { color: #a44a5f; font-weight: bold; }

        .form-container {
            background: white;
            padding: 20px;
            border-radius: 25px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            position: relative;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary-pink);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .btn-submit:active { transform: scale(0.98); }

        /* Tombol Buka Kalkulator */
        .calc-toggle {
            position: absolute;
            right: 20px;
            top: 20px;
            background: var(--soft-green);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
        }

        .history { margin-top: 30px; }
        .history h3 { border-bottom: 2px solid var(--primary-pink); padding-bottom: 5px; }

        .transaction-item {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Notifikasi Motivasi */
        #notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 400px;
            background: var(--soft-green);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 4000;
            border: 2px solid white;
        }

        #notification.show { top: 20px; }

        /* MODAL KALKULATOR */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 25px;
            width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 3px solid var(--primary-pink);
        }

        .calc-display {
            width: 100%;
            height: 50px;
            background: #f9f9f9;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            box-sizing: border-box;
            color: var(--dark-text);
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            padding: 12px 5px;
            border: none;
            border-radius: 10px;
            background: var(--background);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:hover { background: var(--primary-pink); color: white; }
        .calc-btn.op { background: var(--soft-green); color: #2d6a4f; }
        .calc-btn.eq { background: var(--accent-gold); color: white; grid-column: span 2; }
        .calc-btn.clear { background: #ffcfcf; color: #a44a5f; grid-column: span 2; }
        
        /* KONVERTER MATA UANG */
        .currency-converter {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed var(--primary-pink);
        }

        .currency-row {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .currency-row select { margin: 0; padding: 8px; font-size: 0.8rem; flex: 1; }
        .currency-row button { 
            flex: 1; 
            padding: 8px; 
            border: none; 
            background: var(--soft-green); 
            border-radius: 10px; 
            cursor: pointer;
            font-size: 0.8rem;
            color: #2d6a4f;
        }

        #convResult {
            font-size: 0.9rem;
            text-align: center;
            background: #fff9fa;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            color: #a44a5f;
            font-weight: bold;
            min-height: 20px;
        }
        
        .calc-footer {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        
        .use-val-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--primary-pink);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="notification">
        <p id="notif-text">Semangat terus ya!</p>
    </div>

    <!-- Overlay Kalkulator -->
    <div class="modal-overlay" id="calcModal">
        <div class="calculator">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: bold; color: var(--accent-gold);">Kalkulator Flora 🌸</span>
                <span style="cursor: pointer;" onclick="toggleCalc()">✕</span>
            </div>
            
            <input type="text" class="calc-display" id="calcScreen" disabled value="0">
            
            <div class="calc-grid">
                <button class="calc-btn clear" onclick="clearCalc()">Hapus</button>
                <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
                <button class="calc-btn op" onclick="pressCalc('*')">×</button>
                
                <button class="calc-btn" onclick="pressCalc('7')">7</button>
                <button class="calc-btn" onclick="pressCalc('8')">8</button>
                <button class="calc-btn" onclick="pressCalc('9')">9</button>
                <button class="calc-btn op" onclick="pressCalc('-')">-</button>
                
                <button class="calc-btn" onclick="pressCalc('4')">4</button>
                <button class="calc-btn" onclick="pressCalc('5')">5</button>
                <button class="calc-btn" onclick="pressCalc('6')">6</button>
                <button class="calc-btn op" onclick="pressCalc('+')">+</button>
                
                <button class="calc-btn" onclick="pressCalc('1')">1</button>
                <button class="calc-btn" onclick="pressCalc('2')">2</button>
                <button class="calc-btn" onclick="pressCalc('3')">3</button>
                <button class="calc-btn eq" onclick="solveCalc()">=</button>
                
                <button class="calc-btn" style="grid-column: span 2;" onclick="pressCalc('0')">0</button>
                <button class="calc-btn" onclick="pressCalc('.')">.</button>
            </div>

            <!-- Bagian Konverter -->
            <div class="currency-converter">
                <p style="font-size: 0.8rem; margin: 0 0 5px 0; text-align: center;">Konversi Rupiah (IDR) ke:</p>
                <div class="currency-row">
                    <select id="targetCurrency">
                        <option value="USD">🇺🇸 Dollar (USD)</option>
                        <option value="JPY">🇯🇵 Yen (JPY)</option>
                        <option value="EUR">🇪🇺 Euro (EUR)</option>
                        <option value="SGD">🇸🇬 Dollar (SGD)</option>
                    </select>
                    <button onclick="convertCurrency()">Konversi 💱</button>
                </div>
                <div id="convResult">Hasil konversi akan muncul di sini</div>
            </div>

            <div class="calc-footer">
                <button class="use-val-btn" onclick="useCalcValue()">Gunakan Angka Ini ✨</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🌸 FloraFinance</h1>
            <p>Rawat keuanganmu seindah bunga</p>
        </header>

        <div class="balance-card">
            <h2>Saldo Saat Ini</h2>
            <h1 id="total-balance">Rp 0</h1>
            <div class="stats">
                <div class="stat-box">
                    <span>Pemasukan</span><br>
                    <span class="income-text" id="total-income">Rp 0</span>
                </div>
                <div class="stat-box">
                    <span>Pengeluaran</span><br>
                    <span class="expense-text" id="total-expense">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="form-container">
            <button class="calc-toggle" onclick="toggleCalc()" title="Buka Kalkulator">🧮</button>
            <h3>Catatan Baru</h3>
            <input type="text" id="desc" placeholder="Keterangan (Contoh: Jual Buket)">
            <input type="number" id="amount" placeholder="Nominal (Rp)">
            <select id="type">
                <option value="income">Pemasukan (Masuk)</option>
                <option value="expense">Pengeluaran (Keluar)</option>
            </select>
            <button class="btn-submit" onclick="handleTransaction()">Simpan Catatan 🌷</button>
        </div>

        <div class="history">
            <h3>Riwayat Transaksi</h3>
            <div id="list">
                <!-- Data akan muncul di sini -->
            </div>
        </div>
    </div>

    <script>
        // DATABASE LOKAL & LOGIKA (JAVASCRIPT)
        let transactions = JSON.parse(localStorage.getItem('flora_transactions')) || [];

        const quotes = [
            "Hebat! Satu benih tabungan telah kamu tanam hari ini. 🌱",
            "Uang yang disimpan adalah bunga yang akan mekar di masa depan. 🌸",
            "Disiplin keuangan adalah cara terbaik menyirami impianmu. 🚿",
            "Catatan kecil hari ini, kebebasan finansial di hari esok! ✨",
            "Setiap rupiah yang dihemat adalah kelopak bunga yang baru. 🌷",
            "Jangan biarkan keinginan sesaat melayukan rencana besarmu. 🥀",
            "Menabung hari ini, memanen kebahagiaan di masa depan. 🌾",
            "Bijak mengelola uang adalah tanda kamu menghargai kerja kerasmu. 💎",
            "Sedikit demi sedikit, lama-lama jadi taman yang indah! 🌻",
            "Keuangan yang rapi membuat pikiran setenang taman bunga. 🍃",
            "Wah, pemasukan baru! Jangan lupa sisihkan untuk kebaikan ya. 🤲",
            "Pengeluaran tercatat, kendali keuangan ada di tanganmu! 🎮",
            "Hemat bukan berarti pelit, tapi cerdas mengatur prioritas. 🧠",
            "Kamu luar biasa sudah konsisten mencatat hari ini! 🌟",
            "Self-reward boleh, tapi pastikan tabungan tetap tumbuh. 🍧",
            "Jadikan menabung sebagai hobi yang menyenangkan. 🎨",
            "Masa depanmu sangat berharga, persiapkan dengan baik. 🏹",
            "Taman yang indah butuh perawatan, begitu juga dompetmu! 🧤",
            "Fokus pada tujuan jangka panjangmu, jangan menyerah! 🎯",
            "Bangga padamu yang sudah peduli dengan masa depan finansial. 🌹"
        ];

        // LOGIKA KALKULATOR
        let calcExpression = "";

        function toggleCalc() {
            const modal = document.getElementById('calcModal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function pressCalc(val) {
            calcExpression += val;
            document.getElementById('calcScreen').value = calcExpression;
        }

        function clearCalc() {
            calcExpression = "";
            document.getElementById('calcScreen').value = "0";
            document.getElementById('convResult').innerText = "Hasil konversi akan muncul di sini";
        }

        function solveCalc() {
            try {
                const result = eval(calcExpression);
                calcExpression = result.toString();
                document.getElementById('calcScreen').value = calcExpression;
            } catch (e) {
                document.getElementById('calcScreen').value = "Error";
                calcExpression = "";
            }
        }

        async function convertCurrency() {
            const screen = document.getElementById('calcScreen');
            const target = document.getElementById('targetCurrency').value;
            const resDiv = document.getElementById('convResult');
            
            const amountIDR = parseFloat(screen.value);
            
            if (isNaN(amountIDR) || amountIDR <= 0) {
                resDiv.innerText = "Masukkan angka di kalkulator dulu!";
                return;
            }

            resDiv.innerText = "Menghitung... ⏳";

            try {
                // Menggunakan API publik gratis untuk nilai tukar
                const response = await fetch(`https://open.er-api.com/v6/latest/IDR`);
                const data = await response.json();
                
                if (data.result === "success") {
                    const rate = data.rates[target];
                    const converted = (amountIDR * rate).toFixed(2);
                    
                    let symbol = "";
                    if (target === "USD") symbol = "$";
                    if (target === "JPY") symbol = "¥";
                    if (target === "EUR") symbol = "€";
                    if (target === "SGD") symbol = "S$";
                    
                    resDiv.innerText = `IDR ${amountIDR.toLocaleString()} = ${symbol}${converted} ${target}`;
                } else {
                    throw new Error("Gagal mengambil data");
                }
            } catch (err) {
                resDiv.innerText = "Maaf, koneksi gagal. Coba lagi nanti! 🌐";
            }
        }

        function useCalcValue() {
            const val = document.getElementById('calcScreen').value;
            if (val !== "Error" && val !== "0" && val !== "") {
                document.getElementById('amount').value = Math.abs(parseFloat(val));
                toggleCalc();
            }
        }

        // LOGIKA TRANSAKSI
        function saveToLocal() {
            localStorage.setItem('flora_transactions', JSON.stringify(transactions));
        }

        function updateUI() {
            const list = document.getElementById('list');
            const totalBalance = document.getElementById('total-balance');
            const totalIncome = document.getElementById('total-income');
            const totalExpense = document.getElementById('total-expense');

            list.innerHTML = '';
            
            let income = 0;
            let expense = 0;

            const sortedTransactions = [...transactions].reverse();

            sortedTransactions.forEach((t) => {
                const amount = parseFloat(t.amount);
                if (t.type === 'income') income += amount;
                else expense += amount;

                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div>
                        <strong>${t.desc}</strong><br>
                        <small>${new Date(t.id).toLocaleDateString()}</small>
                    </div>
                    <span class="${t.type === 'income' ? 'income-text' : 'expense-text'}">
                        ${t.type === 'income' ? '+' : '-'} Rp ${amount.toLocaleString('id-ID')}
                    </span>
                `;
                list.appendChild(item);
            });

            const total = income - expense;
            totalBalance.innerText = `Rp ${total.toLocaleString('id-ID')}`;
            totalIncome.innerText = `Rp ${income.toLocaleString('id-ID')}`;
            totalExpense.innerText = `Rp ${expense.toLocaleString('id-ID')}`;
        }

        function showMotivation() {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notif-text');
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            
            notifText.innerText = randomQuote;
            notif.classList.add('show');
            
            setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        }

        function handleTransaction() {
            const desc = document.getElementById('desc').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;

            if (desc.trim() === '' || amount <= 0) {
                alert('Mohon masukkan keterangan dan nominal yang valid ya, Kak! 🌸');
                return;
            }

            const newTransaction = {
                id: Date.now(),
                desc,
                amount,
                type
            };

            transactions.push(newTransaction);
            saveToLocal();
            updateUI();
            showMotivation();

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        }

        updateUI();
    </script>
</body>
</html>
